<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booker Admin Portal</title>

    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
    <script type="text/javascript" src="./util/data.js"></script>
    <script src="../dist/bundle.js"></script>
    <link href="../dist/main.css" rel="stylesheet">    
    <link rel="shortcut icon" type="image/x-icon" href="https://www.booker.co.uk/images/favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <script src="https://www.google.com/recaptcha/enterprise.js" async defer></script>
  </head>
  <body class="font-[Inter]">
    <button data-drawer-target="navigation-sidebar" data-drawer-toggle="navigation-sidebar" aria-controls="navigation-sidebar" type="button" class="tw:inline-flex tw:items-center tw:p-2 tw:mt-2 tw:ms-3 tw:text-sm tw:text-gray-500 tw:rounded-lg tw:sm:hidden tw:hover:bg-gray-100 tw:focus:outline-none tw:focus:ring-2 tw:focus:ring-gray-200">
      <span class="tw:sr-only">Open sidebar</span>
      <svg class="tw:w-6 tw:h-6" aria-hidden="true" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path clip-rule="evenodd" fill-rule="evenodd" d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"></path>
      </svg>
    </button>
    

    <aside id="navigation-sidebar" class="tw:fixed tw:top-0 tw:left-0 tw:z-40 tw:w-64 tw:h-dvh tw:transition-transform tw:-translate-x-full tw:sm:translate-x-0" aria-label="Sidebar" aria-hidden="true">
      <div class="tw:p-6 tw:bg-gray-50">
         <bkr-header></bkr-header>
      </div>


    <div class="tw:h-dvh tw:px-3 tw:py-4 tw:overflow-y-auto tw:bg-gray-50">
      <ul class="tw:space-y-2 tw:font-medium">
        <div id="navigation-sidebar-container">
         
        </div>
      </ul>
    </div>
    </aside>


    <div class="tw:p-4 tw:sm:ml-64 tw:bg-secondary-1000">
      <div class="tw:flex tw:pb-3 tw:w-full tw:gap-2">
        <div class="tw:w-7/8">
        <form>   
          <label for="admin-portal-search" class="tw:mb-2 tw:text-sm tw:font-medium tw:text-gray-900 tw:sr-only">Search</label>
          <div class="tw:relative">
            <div class="tw:absolute tw:inset-y-0 tw:start-0 tw:flex tw:items-center tw:ps-3 tw:pointer-events-none">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" class="tw:absolute tw:top-[50%] tw:left-4 tw:h-5 tw:w-5 tw:-translate-y-1/2 tw:text-primary"><path d="M17.5 17.5L13.875 13.875M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
            <input type="search" id="default-search" class="tw:w-full tw:flex-grow tw:rounded-full tw:bg-white-1000 tw:py-4 tw:pr-12 tw:pl-12 tw:text-lg tw:placeholder-black-1000 tw:shadow-[4px_4px_10px_-5px_rgba(0,0,0,0.08)] tw:outline-none tw:focus:ring-0 tw:[&::-webkit-search-cancel-button]:hidden tw:[&::-webkit-search-cancel-button]:appearance-none" placeholder="Search" required />
        </div>
      </form>
      </div>
      <div class="tw:flex tw:items-center">
        <button id="userDropdownButton" data-dropdown-toggle="portalUserDropdown" type="button" class="tw:inline-flex tw:items-center tw:rounded-lg tw:justify-center tw:p-2 tw:font-medium tw:text-gray-900 tw:dark:text-white tw:gap-x-2 tw:cursor-pointer">
                        
          <span class="tw:block tw:px-4 tw:w-12 tw:h-12 tw:rounded-full tw:bg-black-1000 tw:text-white tw:font-bold tw:flex tw:justify-center tw:items-center">AP</span>
          <span class="tw:font-bold tw:hidden tw:lg:block account-name">Anj Patel</span>
          <svg class="tw:w-4 tw:h-4 tw:text-gray-900 tw:dark:text-white tw:ms-1" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"></path>
          </svg>

        </button>

        <div id="portalUserDropdown" class="tw:z-10 tw:w-56 tw:hidden tw:divide-y tw:divide-gray-100 tw:overflow-hidden tw:overflow-y-auto tw:rounded-lg tw:bg-white tw:antialiased tw:shadow dark:divide-gray-600 tw:dark:bg-gray-700 tw:block" style="position: absolute; inset: 0px auto auto 0px; margin: 0px; transform: translate3d(592.8px, 62.4px, 0px);" data-popper-placement="bottom">
          <ul class="tw:p-2 tw:text-star tw:font-medium tw:text-gray-900 tw:dark:text-white">
            <li><a href="#" title="" class="tw:inline-flex tw:w-full tw:items-center tw:gap-2 tw:rounded-md tw:px-3 tw:py-2 tw:text-sm tw:hover:bg-gray-100 tw:dark:hover:bg-gray-600"> My Account </a></li>
          </ul>
      
          <div class="tw:p-2 tw:text-sm tw:font-medium tw:text-gray-900 tw:dark:text-white">
            <a href="#" title="" class="tw:inline-flex tw:w-full tw:items-center tw:gap-2 tw:rounded-md tw:px-3 tw:py-2 tw:text-sm tw:hover:bg-gray-100 tw:dark:hover:bg-gray-600"> Sign Out </a>
          </div>
        </div>
          
      </div>

       
      </div>

      
      <div class="tw:p-4 tw:h-screen tw:border-2 tw:border-gray-200 tw:border-dashed tw:rounded-lg">
        <div class="tw:flex tw:flex-wrap tw:justify-center tw:bg-gray-100 tw:text-center tw:rounded-2xl tw:bg-secondary-1200">
          <bkr-favourite href="/admin/telesales" function="Telesales"></bkr-favourite>
          <bkr-favourite href="/admin/function/adminusers" function="Portal User Management"></bkr-favourite>
          <bkr-favourite href="/admin/function/AdminAllocations" function="My Allocations/Weekly Deals"></bkr-favourite>
          <bkr-favourite href="/admin/DigitalVouchers" function="Create Digital Vouchers"></bkr-favourite>
        </div>
      </div>
    </div>
    <script>
      let navigationSidebarContainer = document.querySelector('#navigation-sidebar-container');
      
      let navigationData = [...data.pages].filter(data => data.uri === 'home')[0].content[0];
      navigationSidebarContainer.innerHTML = [...navigationData.navigation].map(nav => 
        `<bkr-nav-item-parent id="${nav.id}" icon="${nav.icon}" name="${nav.name}"></bkr-nav-item-parent>`).join(''); 
    </script>
  </body>
</html>
